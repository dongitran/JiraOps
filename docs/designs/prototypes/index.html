<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jira Ops Prototype</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./assets/gallery.css?v=pre-0-1-35" />
  </head>
  <body class="gallery-page gallery-theme-dark">
    <main class="workspace-shell">
      <aside class="sidebar-host">
        <header class="prototype-view-header" aria-label="JiraOps view header">
          <div class="prototype-view-title">
            <strong>JiraOps:</strong>
            <span id="prototype-connection-state">Not connected</span>
          </div>
          <button class="prototype-settings-button" type="button" aria-label="Open Settings" title="Open Settings">
            ⚙
          </button>
        </header>
        <iframe
          id="prototype-frame"
          title="Jira Ops Prototype"
          loading="eager"
          src="./variants/dashboard.html?v=pre-0-1-35"
        ></iframe>
        <nav class="floating-nav" aria-label="Prototype controls">
          <button
            id="controls-toggle"
            class="controls-toggle"
            type="button"
            aria-label="Toggle prototype controls"
            aria-expanded="false"
            aria-controls="floating-controls-panel"
          >
            i
          </button>
          <div id="floating-controls-panel" class="floating-controls-panel" hidden>
            <button id="theme-cycle" type="button" aria-live="polite">Theme: Dark</button>
          </div>
        </nav>
      </aside>
      <section class="editor-surface" aria-label="Jira Ops issue detail preview"></section>
    </main>
    <script type="module" src="./assets/gallery.js?v=pre-0-1-35"></script>
  </body>
</html>
